<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
  <script>
    const adminToken = sessionStorage.getItem("adminToken");
    if (!adminToken) {
      window.location.href = "login.html";
    }
  </script>
</head>
<body class="bg-[#fafafa] text-slate-800 flex h-screen overflow-hidden antialiased">

  <!-- Sidebar Nav -->
  <aside class="w-64 bg-slate-950 text-gray-300 flex flex-col justify-between border-r border-slate-900">
    <div class="p-6">
      <h2 class="text-white text-xl font-black tracking-tight flex items-center gap-2 mb-8">
        <i class="fa-solid fa-gauge-high text-white"></i> Admin Panel
      </h2>
      <nav class="space-y-1">
        <button onclick="showSection('dashboard')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-900 hover:text-white flex items-center gap-3 transition text-xs uppercase tracking-wider font-semibold">
          <i class="fa-solid fa-house"></i> Dashboard
        </button>
        <button onclick="showSection('add-article')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-900 hover:text-white flex items-center gap-3 transition text-xs uppercase tracking-wider font-semibold">
          <i class="fa-solid fa-plus"></i> Tambah Artikel
        </button>
        <button onclick="showSection('manage-articles')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-900 hover:text-white flex items-center gap-3 transition text-xs uppercase tracking-wider font-semibold">
          <i class="fa-solid fa-list"></i> Kelola Artikel
        </button>
        <button onclick="showSection('manage-categories')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-900 hover:text-white flex items-center gap-3 transition text-xs uppercase tracking-wider font-semibold">
          <i class="fa-solid fa-tags"></i> Kelola Kategori
        </button>
      </nav>
    </div>
    <div class="p-6 border-t border-slate-900 space-y-4">
      <a href="index.html" class="text-xs uppercase tracking-wider font-semibold hover:text-white flex items-center gap-2 transition"><i class="fa-solid fa-arrow-left"></i> Lihat Website</a>
      <button onclick="logout()" class="w-full text-left text-xs uppercase tracking-wider font-semibold text-rose-400 hover:text-rose-300 flex items-center gap-2 transition"><i class="fa-solid fa-power-off"></i> Keluar (Logout)</button>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <main class="flex-grow p-10 overflow-y-auto">
    
    <!-- 1. Section: Dashboard / Statistik -->
    <section id="dashboard-sec" class="space-y-8">
      <h1 class="text-3xl font-black text-slate-950 tracking-tight">Dashboard Statistik</h1>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-gray-400 text-xs uppercase tracking-wider font-bold">Total Artikel</p>
            <h2 class="text-4xl font-black text-slate-900 mt-2" id="totalArt">0</h2>
          </div>
          <div class="p-4 bg-slate-50 text-slate-900 rounded-full text-xl"><i class="fa-solid fa-newspaper"></i></div>
        </div>
        <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-gray-400 text-xs uppercase tracking-wider font-bold">Total Pembaca (Views)</p>
            <h2 class="text-4xl font-black text-slate-900 mt-2" id="totalViews">0</h2>
          </div>
          <div class="p-4 bg-slate-50 text-slate-900 rounded-full text-xl"><i class="fa-solid fa-eye"></i></div>
        </div>
      </div>
    </section>

    <!-- 2. Section: Tambah & Edit Artikel Form -->
    <section id="add-article-sec" class="hidden max-w-3xl">
      <h1 class="text-3xl font-black text-slate-950 tracking-tight mb-8" id="formTitle">Tulis Artikel Baru</h1>
      <form id="articleForm" onsubmit="saveArticle(event)" class="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm space-y-6">
        <input type="hidden" id="artId">
        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="block text-xs uppercase tracking-wider font-bold text-slate-700 mb-2">Judul Artikel</label>
            <input type="text" id="title" required onkeyup="generateSlug()" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-slate-950">
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wider font-bold text-slate-700 mb-2">Slug URL</label>
            <input type="text" id="slug" required readonly class="w-full border border-gray-200 bg-gray-50 rounded-xl px-4 py-3 text-sm text-gray-500">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="block text-xs uppercase tracking-wider font-bold text-slate-700 mb-2">Kategori</label>
            <select id="category" required class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm bg-white focus:outline-none focus:ring-1 focus:ring-slate-950"></select>
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wider font-bold text-slate-700 mb-2">Penulis</label>
            <input type="text" id="author" required class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-slate-950">
          </div>
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider font-bold text-slate-700 mb-2">Ringkasan Singkat (Summary)</label>
          <input type="text" id="summary" required class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-slate-950">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider font-bold text-slate-700 mb-2">Unggah Thumbnail (Maks. 3MB)</label>
          <input type="file" id="thumbnailFile" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-slate-50 file:text-slate-900 hover:file:bg-slate-100">
          <input type="hidden" id="thumbnailUrl">
          <p class="text-xs text-gray-400 mt-2 font-light" id="uploadStatus">Kosongkan jika menggunakan link luar / tidak diganti.</p>
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider font-bold text-slate-700 mb-2">Isi Artikel</label>
          <textarea id="content" rows="8" required class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-slate-950 placeholder-gray-300" placeholder="Ketik isi artikel di sini..."></textarea>
        </div>
        <div class="flex gap-6">
          <label class="flex items-center gap-2 text-xs uppercase tracking-wider font-bold text-slate-700">
            <input type="checkbox" id="isEditorChoice" class="rounded border-gray-300 text-slate-900 focus:ring-slate-900"> Pilihan Editor
          </label>
          <label class="flex items-center gap-2 text-xs uppercase tracking-wider font-bold text-slate-700">
            <select id="status" class="border border-gray-200 rounded-xl px-3 py-1.5 bg-white text-xs font-semibold uppercase tracking-wider text-slate-800">
              <option value="Published">Publish</option>
              <option value="Draft">Draft</option>
            </select>
          </label>
        </div>
        <button type="submit" id="saveBtn" class="bg-slate-900 text-white px-8 py-3 rounded-full hover:bg-slate-800 transition font-semibold text-xs uppercase tracking-wider">
          Simpan Artikel
        </button>
      </form>
    </section>

    <!-- 3. Section: Kelola Artikel (Tabel) -->
    <section id="manage-articles-sec" class="hidden">
      <h1 class="text-3xl font-black text-slate-950 tracking-tight mb-8">Kelola Artikel</h1>
      <div class="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden">
        <table class="min-w-full divide-y divide-gray-100 text-sm">
          <thead class="bg-gray-50 text-slate-700 uppercase font-extrabold text-[10px] tracking-wider">
            <tr>
              <th class="px-6 py-4 text-left">Judul</th>
              <th class="px-6 py-4 text-left">Kategori</th>
              <th class="px-6 py-4 text-left">Status</th>
              <th class="px-6 py-4 text-left">Views</th>
              <th class="px-6 py-4 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="articlesTableBody" class="divide-y divide-gray-50">
            <!-- Diisi artikel secara dinamis -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- 4. Section: Kelola Kategori -->
    <section id="manage-categories-sec" class="hidden max-w-md">
      <h1 class="text-3xl font-black text-slate-950 tracking-tight mb-8">Kelola Kategori</h1>
      <form onsubmit="addCategory(event)" class="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm mb-8 space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-wider font-bold text-slate-700 mb-2">Nama Kategori</label>
          <input type="text" id="newCatName" required class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-slate-950">
        </div>
        <button type="submit" class="bg-slate-900 text-white px-6 py-3 rounded-full text-xs font-semibold uppercase tracking-wider hover:bg-slate-800 transition">
          Tambah Kategori
        </button>
      </form>
      <div class="bg-white rounded-3xl border border-gray-100 shadow-sm p-6">
        <h3 class="font-bold text-sm uppercase tracking-wider text-slate-800 mb-4 pb-2 border-b">Daftar Kategori</h3>
        <ul id="catList" class="divide-y divide-gray-50 text-xs"></ul>
      </div>
    </section>

  </main>

  <script src="config.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      loadStats();
      loadAllData();
    });

    function logout() {
      sessionStorage.removeItem("adminToken");
      window.location.href = "login.html";
    }

    function showSection(sec) {
      document.getElementById("dashboard-sec").classList.add("hidden");
      document.getElementById("add-article-sec").classList.add("hidden");
      document.getElementById("manage-articles-sec").classList.add("hidden");
      document.getElementById("manage-categories-sec").classList.add("hidden");

      document.getElementById(`${sec}-sec`).classList.remove("hidden");
    }

    function generateSlug() {
      const title = document.getElementById("title").value;
      document.getElementById("slug").value = title.toLowerCase()
        .replace(/[^a-z0-9 -]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
    }

    async function loadStats() {
      try {
        const res = await fetch(`${API_URL}?action=getStats&token=${encodeURIComponent(adminToken)}`);
        const json = await res.json();
        if (json.success) {
          document.getElementById("totalArt").innerText = json.data.totalArticles;
          document.getElementById("totalViews").innerText = json.data.totalViews;
        } else if (json.error === "Unauthorized") {
          logout();
        }
      } catch (err) { console.error("Error stats", err); }
    }

    async function loadAllData() {
      try {
        const [resArt, resCat] = await Promise.all([
          fetch(`${API_URL}?action=getAllArticles&token=${encodeURIComponent(adminToken)}`),
          fetch(`${API_URL}?action=getCategories`)
        ]);
        const dataArt = await resArt.json();
        const dataCat = await resCat.json();

        if (dataArt.success) {
          renderArticlesTable(dataArt.data);
        } else if (dataArt.error === "Unauthorized") {
          logout();
        }
        
        if (dataCat.success) {
          renderCategoriesSelect(dataCat.data);
          renderCategoriesList(dataCat.data);
        }
      } catch (err) { console.error(err); }
    }

    function renderArticlesTable(articles) {
      const tbody = document.getElementById("articlesTableBody");
      tbody.innerHTML = articles.map(art => `
        <tr class="hover:bg-slate-50 transition">
          <td class="px-6 py-4 font-bold text-slate-900">${art.Title}</td>
          <td class="px-6 py-4 text-gray-500 text-xs uppercase tracking-wider font-semibold">${art.Category}</td>
          <td class="px-6 py-4"><span class="px-3 py-1 text-[10px] rounded-full font-bold uppercase tracking-wider ${art.Status === 'Published' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}">${art.Status}</span></td>
          <td class="px-6 py-4 text-gray-500 font-medium">${art.Views || 0}</td>
          <td class="px-6 py-4 text-center space-x-3">
            <button onclick="editArticlePre('${art.ID}')" class="text-slate-900 hover:text-black font-semibold"><i class="fa-solid fa-pen-to-square"></i></button>
            <button onclick="deleteArticle('${art.ID}')" class="text-rose-600 hover:text-rose-900 font-semibold"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    function renderCategoriesSelect(categories) {
      const select = document.getElementById("category");
      select.innerHTML = categories.map(cat => `<option value="${cat.Name}">${cat.Name}</option>`).join('');
    }

    function renderCategoriesList(categories) {
      const list = document.getElementById("catList");
      list.innerHTML = categories.map(cat => `<li class="py-3 flex justify-between"><span>${cat.Name}</span> <span class="text-gray-400 font-mono text-[10px]">${cat.Slug}</span></li>`).join('');
    }

    async function handleImageUpload() {
      const fileInput = document.getElementById("thumbnailFile");
      if (fileInput.files.length === 0) return document.getElementById("thumbnailUrl").value;

      const file = fileInput.files[0];
      if (file.size > 3 * 1024 * 1024) {
        throw new Error("Ukuran berkas gambar melampaui batas 3MB.");
      }

      const reader = new FileReader();
      document.getElementById("uploadStatus").innerText = "Mengunggah gambar...";
      
      const base64Promise = new Promise((resolve) => {
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(file);
      });

      const base64Data = await base64Promise;
      
      const response = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'uploadImage',
          token: adminToken,
          base64: base64Data,
          mimeType: file.type,
          filename: file.name
        })
      });

      const resJson = await response.json();
      if (resJson.success) {
        document.getElementById("uploadStatus").innerText = "Gambar sukses diunggah ke Google Drive!";
        return resJson.url;
      } else {
        throw new Error("Gagal mengunggah gambar");
      }
    }

    async function saveArticle(e) {
      e.preventDefault();
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.innerText = "Menyimpan...";

      try {
        const imageUrl = await handleImageUpload();
        const id = document.getElementById("artId").value;
        const isEdit = id !== "";

        const articleObj = {
          Title: document.getElementById("title").value,
          Slug: document.getElementById("slug").value,
          Summary: document.getElementById("summary").value,
          Content: document.getElementById("content").value,
          Category: document.getElementById("category").value,
          Author: document.getElementById("author").value,
          Status: document.getElementById("status").value,
          IsEditorChoice: document.getElementById("isEditorChoice").checked,
          Thumbnail: imageUrl || 'https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=500'
        };

        if (isEdit) articleObj.ID = id;

        const payload = {
          action: isEdit ? 'editArticle' : 'addArticle',
          token: adminToken,
          article: articleObj
        };

        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          alert("Artikel berhasil disimpan!");
          document.getElementById("articleForm").reset();
          document.getElementById("artId").value = "";
          document.getElementById("uploadStatus").innerText = "";
          loadAllData();
          loadStats();
          showSection('manage-articles');
        } else {
          alert("Gagal menyimpan: " + result.message);
        }
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "Simpan Artikel";
      }
    }

    async function editArticlePre(id) {
      document.getElementById("formTitle").innerText = "Edit Artikel";
      const res = await fetch(`${API_URL}?action=getAllArticles&token=${encodeURIComponent(adminToken)}`);
      const data = await res.json();
      const art = data.data.find(item => item.ID === id);

      if (art) {
        document.getElementById("artId").value = art.ID;
        document.getElementById("title").value = art.Title;
        document.getElementById("slug").value = art.Slug;
        document.getElementById("summary").value = art.Summary;
        document.getElementById("content").value = art.Content;
        document.getElementById("category").value = art.Category;
        document.getElementById("author").value = art.Author;
        document.getElementById("status").value = art.Status;
        document.getElementById("thumbnailUrl").value = art.Thumbnail;
        document.getElementById("isEditorChoice").checked = (art.IsEditorChoice === true || art.IsEditorChoice === 'TRUE');
        
        showSection('add-article');
      }
    }

    async function deleteArticle(id) {
      if (confirm("Apakah Anda yakin ingin menghapus artikel ini?")) {
        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ 
              action: 'deleteArticle', 
              token: adminToken,
              id: id 
            })
          });
          const result = await res.json();
          if (result.success) {
            alert("Artikel sukses dihapus!");
            loadAllData();
            loadStats();
          }
        } catch (err) { alert("Gagal menghapus"); }
      }
    }

    async function addCategory(e) {
      e.preventDefault();
      const name = document.getElementById("newCatName").value;
      const slug = name.toLowerCase().replace(/\s+/g, '-');
      
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ 
          action: 'addCategory', 
          token: adminToken,
          name, 
          slug 
        })
      });
      const result = await res.json();
      if (result.success) {
        alert("Kategori berhasil ditambahkan!");
        document.getElementById("newCatName").value = "";
        loadAllData();
      }
    }
  </script>
</body>
</html>
