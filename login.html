<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Portal Artikel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-lg shadow-md border w-full max-w-md">
    <div class="text-center mb-6">
      <h2 class="text-3xl font-extrabold text-gray-950">Admin Login</h2>
      <p class="text-gray-500 text-sm mt-1">Masukkan kata sandi untuk masuk ke CMS</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Kata Sandi</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      
      <button type="submit" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-md transition text-sm">
        Masuk
      </button>
      
      <p id="errorMessage" class="text-center text-sm text-red-600 font-medium hidden mt-2"></p>
    </form>
    
    <div class="text-center mt-6">
      <a href="index.html" class="text-xs text-indigo-500 hover:underline">Kembali ke Beranda</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // Cegah masuk halaman login jika sudah terotentikasi
    if (sessionStorage.getItem("adminToken")) {
      window.location.href = "admin.html";
    }

    async function handleLogin(e) {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("loginBtn");
      const err = document.getElementById("errorMessage");

      btn.disabled = true;
      btn.innerText = "Memverifikasi...";
      err.classList.add("hidden");

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'login',
            password: password
          })
        });
        const result = await res.json();

        if (result.success) {
          // Simpan token di sessionStorage
          sessionStorage.setItem("adminToken", result.token);
          window.location.href = "admin.html";
        } else {
          err.innerText = "Password yang Anda masukkan salah.";
          err.classList.remove("hidden");
        }
      } catch (error) {
        err.innerText = "Terjadi gangguan koneksi server.";
        err.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.innerText = "Masuk";
      }
    }
  </script>
</body>
</html>
