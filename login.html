<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Portal Artikel</title>
  <link rel="icon" type="image/x-icon" id="dynamicFavicon" href="https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=64">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fcfcfc;
    }
  </style>
</head>
<body class="bg-[#fafafa] flex items-center justify-center min-h-screen antialiased">

  <div class="bg-white p-10 rounded-3xl border border-gray-100 w-full max-w-md shadow-sm">
    <div class="text-center mb-8">
      <div id="loginLogoContainer" class="mb-4 hidden flex justify-center">
        <img id="loginLogo" src="" alt="Logo" class="h-12 w-auto object-contain">
      </div>
      <h2 class="text-2xl font-black text-slate-900 tracking-tight" id="loginHeaderTitle">Admin Login</h2>
      <p class="text-gray-400 text-xs mt-2 font-light">Masukkan kata sandi untuk masuk ke CMS</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-6">
      <div>
        <label class="block text-xs uppercase tracking-wider font-bold text-slate-700 mb-2">Kata Sandi</label>
        <div class="relative">
          <input type="password" id="password" required placeholder="••••••••" class="w-full border border-gray-200 rounded-xl pl-4 pr-12 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-slate-950 transition">
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-slate-900 focus:outline-none transition p-1" title="Lihat/Sembunyikan Kata Sandi">
            <i id="togglePasswordIcon" class="fa-regular fa-eye text-sm"></i>
          </button>
        </div>
      </div>
      
      <button type="submit" id="loginBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 rounded-full transition text-xs uppercase tracking-wider">
        Masuk
      </button>
      
      <p id="errorMessage" class="text-center text-xs text-rose-600 font-semibold hidden mt-3"></p>
    </form>
    
    <div class="text-center mt-8">
      <a href="index.html" class="text-xs text-slate-500 hover:text-slate-900 border-b border-gray-200 hover:border-slate-900 pb-0.5 transition font-medium">Kembali ke Beranda</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    if (sessionStorage.getItem("adminToken")) {
      window.location.href = "admin.html";
    }

    document.addEventListener("DOMContentLoaded", function() {
      loadSiteSettings();
    });

    async function loadSiteSettings() {
      try {
        const res = await fetch(`${API_URL}?action=getSettings`);
        const json = await res.json();
        if (json.success && json.data) {
          const s = json.data;
          if (s.site_logo) {
            const logo = document.getElementById("loginLogo");
            logo.src = s.site_logo;
            document.getElementById("loginLogoContainer").classList.remove("hidden");
          }
          if (s.site_favicon) document.getElementById("dynamicFavicon").href = s.site_favicon;
        }
      } catch (e) { console.error(e); }
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById("password");
      const icon = document.getElementById("togglePasswordIcon");
      if (passInput.type === "password") {
        passInput.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        passInput.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("loginBtn");
      const err = document.getElementById("errorMessage");

      btn.disabled = true;
      btn.innerText = "Memverifikasi...";
      err.classList.add("hidden");

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', password: password })
        });
        const result = await res.json();

        if (result.success) {
          sessionStorage.setItem("adminToken", result.token);
          window.location.href = "admin.html";
        } else {
          err.innerText = "Password yang Anda masukkan salah.";
          err.classList.remove("hidden");
        }
      } catch (error) {
        err.innerText = "Terjadi gangguan koneksi server.";
        err.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.innerText = "Masuk";
      }
    }
  </script>
</body>
</html>
