<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Portal Artikel</title>
  <link rel="icon" type="image/x-icon" id="dynamicFavicon" href="https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=64">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fcfcfc;
    }
  </style>
</head>
<body class="bg-[#fafafa] flex items-center justify-center min-h-screen antialiased">

  <div class="bg-white p-10 rounded-3xl border border-gray-100 w-full max-w-md shadow-sm">
    <div class="text-center mb-8">
      <div id="loginLogoContainer" class="mb-4 hidden flex justify-center">
        <img id="loginLogo" src="" alt="Logo" class="h-12 w-auto object-contain">
      </div>
      <h2 class="text-2xl font-black text-slate-900 tracking-tight" id="loginHeaderTitle">Admin Login</h2>
      <p class="text-gray-400 text-xs mt-2 font-light">Masukkan kredensial untuk masuk ke CMS</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
      <div>
        <label class="block text-xs uppercase tracking-wider font-bold text-slate-700 mb-2">Email Admin</label>
        <input type="email" id="email" required placeholder="admin@email.com" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-slate-950 transition">
      </div>

      <div>
        <label class="block text-xs uppercase tracking-wider font-bold text-slate-700 mb-2">Kata Sandi</label>
        <div class="relative">
          <input type="password" id="password" required placeholder="••••••••" class="w-full border border-gray-200 rounded-xl pl-4 pr-12 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-slate-950 transition">
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-slate-900 focus:outline-none transition p-1" title="Lihat/Sembunyikan Kata Sandi">
            <i id="togglePasswordIcon" class="fa-regular fa-eye text-sm"></i>
          </button>
        </div>
      </div>
      
      <button type="submit" id="loginBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 rounded-full transition text-xs uppercase tracking-wider flex items-center justify-center gap-2">
        <span>Masuk</span>
      </button>
      
      <p id="errorMessage" class="text-center text-xs text-rose-600 font-semibold hidden mt-3"></p>
    </form>
    
    <div class="text-center mt-8">
      <a href="index.html" class="text-xs text-slate-500 hover:text-slate-900 border-b border-gray-200 hover:border-slate-900 pb-0.5 transition font-medium">Kembali ke Beranda</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    // Memeriksa keberadaan sesi aktif yang benar-benar valid ke server
    async function checkExistingSession() {
      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (error || !session) return;

        // Validasi keaslian session ke server auth Supabase
        const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
        if (user && !userError) {
          window.location.replace("admin.html");
        }
      } catch (err) {
        console.error("Gagal memeriksa session:", err);
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      // Inisialisasi default email dari config.js jika tersedia
      const emailField = document.getElementById("email");
      if (emailField && typeof ADMIN_EMAIL !== "undefined" && ADMIN_EMAIL) {
        emailField.value = ADMIN_EMAIL;
      }

      loadSiteSettings();
      checkExistingSession();
    });

    async function loadSiteSettings() {
      try {
        const { data, error } = await supabaseClient
          .from('settings')
          .select('key, value')
          .in('key', ['site_logo', 'site_favicon']);

        if (error) throw error;
        if (!data || data.length === 0) return;

        const settings = Object.fromEntries(
          data.map(item => [item.key, item.value])
        );

        if (settings.site_logo) {
          const logo = document.getElementById("loginLogo");
          const logoContainer = document.getElementById("loginLogoContainer");
          if (logo) logo.src = settings.site_logo;
          if (logoContainer) logoContainer.classList.remove("hidden");
        }

        if (settings.site_favicon) {
          const favicon = document.getElementById("dynamicFavicon");
          if (favicon) favicon.href = settings.site_favicon;
        }
      } catch (error) {
        console.error("Gagal memuat settings dari Supabase:", error);
      }
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById("password");
      const icon = document.getElementById("togglePasswordIcon");
      if (!passInput || !icon) return;

      if (passInput.type === "password") {
        passInput.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        passInput.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    async function handleLogin(e) {
      e.preventDefault();

      const emailInput = document.getElementById("email");
      const passInput = document.getElementById("password");
      const btn = document.getElementById("loginBtn");
      const err = document.getElementById("errorMessage");

      const email = emailInput ? emailInput.value.trim() : "";
      const password = passInput ? passInput.value : "";

      if (!email || !password) {
        err.innerText = "Email dan kata sandi wajib diisi.";
        err.classList.remove("hidden");
        return;
      }

      // Aktifkan Loading State
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-sm"></i> <span>Memverifikasi...</span>';
      err.classList.add("hidden");

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          console.error("Supabase Login Error:", error.message);
          err.innerText = "Email atau kata sandi yang Anda masukkan salah.";
          err.classList.remove("hidden");
          return;
        }

        if (!data || !data.session) {
          throw new Error("Sesi autentikasi tidak berhasil dibuat.");
        }

        // Navigasi tanpa riwayat agar tidak terjadi loop navigasi
        window.location.replace("admin.html");

      } catch (error) {
        console.error("Gagal melakukan login:", error);
        err.innerText = "Terjadi gangguan saat proses verifikasi. Coba beberapa saat lagi.";
        err.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Masuk</span>';
      }
    }
  </script>
</body>
</html>
