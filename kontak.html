<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hubungi Kami</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fcfcfc;
    }
  </style>
</head>
<body class="bg-[#fafafa] text-slate-900 flex flex-col min-h-screen antialiased">
  <header class="bg-white border-b border-gray-100 h-20 flex items-center justify-between px-8">
    <span class="text-2xl font-black tracking-tight text-slate-900">ALVARO <span class="font-light text-gray-500">NEWS</span></span>
    <nav class="space-x-6 text-sm font-semibold uppercase tracking-wider text-gray-500">
      <a href="index.html" class="hover:text-slate-950 transition">Beranda</a>
      <a href="login.html" class="hover:text-slate-950 transition">Login</a>
      <a href="kontak.html" class="text-slate-900 font-bold border-b-2 border-slate-900 pb-1">Kontak</a>
    </nav>
  </header>

  <main class="max-w-xl mx-auto px-4 py-20 flex-grow">
    <div class="bg-white p-10 rounded-3xl border border-gray-100 shadow-sm">
      <h2 class="text-3xl font-black tracking-tight mb-2">Hubungi Kami</h2>
      <p class="text-gray-400 mb-8 text-sm font-light leading-relaxed">Punya pertanyaan, feedback, atau penawaran kerja sama? Sampaikan pesan Anda di bawah ini.</p>
      
      <form id="contactForm" onsubmit="submitForm(event)" class="space-y-6">
        <div>
          <label class="block text-xs uppercase tracking-wider font-bold text-slate-700 mb-2">Nama Lengkap</label>
          <input type="text" id="name" required class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-slate-950 transition">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider font-bold text-slate-700 mb-2">Email</label>
          <input type="email" id="email" required class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-slate-950 transition">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider font-bold text-slate-700 mb-2">Pesan</label>
          <textarea id="message" rows="5" required class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-slate-950 transition"></textarea>
        </div>
        <button type="submit" id="submitBtn" class="w-full bg-slate-900 text-white py-3.5 rounded-full font-semibold text-xs uppercase tracking-wider hover:bg-slate-800 transition">
          Kirim Pesan
        </button>
        <p id="feedback" class="text-center text-sm hidden"></p>
      </form>
    </div>
  </main>

  <script src="config.js"></script>
  <script>
    async function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const feedback = document.getElementById("feedback");
      
      btn.disabled = true;
      btn.innerText = "Mengirim...";
      
      const payload = {
        action: 'addMessage',
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        if (data.success) {
          feedback.className = "text-center text-sm text-emerald-600 font-semibold mt-4";
          feedback.innerText = "Pesan berhasil terkirim!";
          document.getElementById("contactForm").reset();
        } else {
          feedback.className = "text-center text-sm text-rose-600 font-semibold mt-4";
          feedback.innerText = "Gagal mengirim pesan.";
        }
      } catch (err) {
        feedback.className = "text-center text-sm text-rose-600 font-semibold mt-4";
        feedback.innerText = "Error koneksi.";
      } finally {
        btn.disabled = false;
        btn.innerText = "Kirim Pesan";
        feedback.classList.remove("hidden");
      }
    }
  </script>
</body>
</html>
