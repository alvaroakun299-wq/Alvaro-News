<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hubungi Kami - Alvaro News</title>
  <link rel="icon" type="image/x-icon" id="dynamicFavicon" href="https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=64">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fcfcfc;
    }
  </style>
</head>
<body class="bg-[#fafafa] text-slate-900 flex flex-col min-h-screen antialiased">
  <header class="bg-white border-b border-gray-100 h-20 flex items-center justify-between px-8">
    <a href="index.html" class="flex items-center gap-3" id="siteHeaderBrand">
      <span class="site-header-logo-container hidden"><img id="siteHeaderLogo" src="" alt="Logo" class="h-9 w-auto object-contain"></span>
      <span id="siteHeaderTitle" class="text-2xl font-black tracking-tight text-slate-900 flex items-center gap-2">
        <i class="fa-solid fa-feather-pointed text-slate-800" id="siteDefaultIcon"></i> ALVARO <span class="font-light text-gray-500">NEWS</span>
      </span>
    </a>
    <nav class="space-x-6 text-sm font-semibold uppercase tracking-wider text-gray-500">
      <a href="index.html" class="hover:text-slate-950 transition">Beranda</a>
      <a href="login.html" class="hover:text-slate-950 transition">Login</a>
      <a href="kontak.html" class="text-slate-900 font-bold border-b-2 border-slate-900 pb-1">Kontak</a>
    </nav>
  </header>

  <main class="max-w-xl mx-auto px-4 py-20 flex-grow">
    <div class="bg-white p-10 rounded-3xl border border-gray-100 shadow-sm">
      <h2 class="text-3xl font-black tracking-tight mb-2">Hubungi Kami</h2>
      <p class="text-gray-400 mb-8 text-sm font-light leading-relaxed">Punya pertanyaan, feedback, atau penawaran kerja sama? Sampaikan pesan Anda di bawah ini.</p>
      
      <form id="contactForm" onsubmit="submitForm(event)" class="space-y-6">
        <div>
          <label class="block text-xs uppercase tracking-wider font-bold text-slate-700 mb-2">Nama Lengkap</label>
          <input type="text" id="name" required class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-slate-950 transition">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider font-bold text-slate-700 mb-2">Email</label>
          <input type="email" id="email" required class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-slate-950 transition">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider font-bold text-slate-700 mb-2">Pesan</label>
          <textarea id="message" rows="5" required class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-slate-950 transition"></textarea>
        </div>
        <button type="submit" id="submitBtn" class="w-full bg-slate-900 text-white py-3.5 rounded-full font-semibold text-xs uppercase tracking-wider hover:bg-slate-800 transition">
          Kirim Pesan
        </button>
        <p id="feedback" class="text-center text-sm hidden"></p>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      loadSiteSettings();
    });

    async function loadSiteSettings() {
      try {
        const { data, error } = await supabaseClient
          .from('settings')
          .select('key, value')
          .in('key', [
            'site_name',
            'site_logo',
            'site_favicon'
          ]);

        if (error) {
          throw error;
        }

        if (!data || data.length === 0) {
          console.warn("Settings Supabase tidak ditemukan.");
          return;
        }

        const settings = Object.fromEntries(
          data.map(item => [item.key, item.value])
        );

        // ==========================================
        // SITE NAME
        // ==========================================
        if (settings.site_name) {
          const siteTitle =
            document.getElementById("siteHeaderTitle");

          if (siteTitle) {
            siteTitle.innerText = settings.site_name;
          }
        }

        // ==========================================
        // SITE LOGO
        // ==========================================
        if (settings.site_logo) {
          const logoImg =
            document.getElementById("siteHeaderLogo");

          if (logoImg) {
            logoImg.src = settings.site_logo;
            logoImg.classList.remove("hidden");

            if (logoImg.parentElement) {
              logoImg.parentElement.classList.remove("hidden");
            }
          }

          const defaultIcon =
            document.getElementById("siteDefaultIcon");

          if (defaultIcon) {
            defaultIcon.classList.add("hidden");
          }
        }

        // ==========================================
        // FAVICON
        // ==========================================
        if (settings.site_favicon) {
          const favicon =
            document.getElementById("dynamicFavicon");

          if (favicon) {
            favicon.href = settings.site_favicon;
          }
        }

      } catch (error) {
        console.error(
          "Gagal memuat settings dari Supabase:",
          error
        );
      }
    }

    async function submitForm(e) {
      e.preventDefault();

      const btn =
        document.getElementById("submitBtn");

      const feedback =
        document.getElementById("feedback");

      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const message =
        document.getElementById("message").value.trim();

      // ==========================================
      // VALIDASI
      // ==========================================
      if (!name || !email || !message) {
        feedback.className =
          "text-center text-sm text-rose-600 font-semibold mt-4";

        feedback.innerText =
          "Nama, email, dan pesan wajib diisi.";

        feedback.classList.remove("hidden");
        return;
      }

      if (name.length > 100) {
        feedback.className =
          "text-center text-sm text-rose-600 font-semibold mt-4";

        feedback.innerText =
          "Nama maksimal 100 karakter.";

        feedback.classList.remove("hidden");
        return;
      }

      if (email.length > 150) {
        feedback.className =
          "text-center text-sm text-rose-600 font-semibold mt-4";

        feedback.innerText =
          "Email maksimal 150 karakter.";

        feedback.classList.remove("hidden");
        return;
      }

      if (message.length > 5000) {
        feedback.className =
          "text-center text-sm text-rose-600 font-semibold mt-4";

        feedback.innerText =
          "Pesan maksimal 5000 karakter.";

        feedback.classList.remove("hidden");
        return;
      }

      // ==========================================
      // TAMPILAN LOADING
      // ==========================================
      btn.disabled = true;
      btn.innerText = "Mengirim...";

      feedback.classList.add("hidden");

      try {

        // ==========================================
        // INSERT KE SUPABASE
        // ==========================================
        const { error } = await supabaseClient
          .from('messages')
          .insert([{
            id: `MSG-${Date.now()}-${Math.random()
              .toString(36)
              .substring(2, 8)}`,
            name: name,
            email: email,
            message: message
          }]);

        if (error) {
          throw error;
        }

        // ==========================================
        // BERHASIL
        // ==========================================
        feedback.className =
          "text-center text-sm text-emerald-600 font-semibold mt-4";

        feedback.innerText =
          "Pesan berhasil terkirim!";

        document
          .getElementById("contactForm")
          .reset();

      } catch (error) {

        console.error(
          "Gagal mengirim pesan ke Supabase:",
          error
        );

        // ==========================================
        // GAGAL
        // ==========================================
        feedback.className =
          "text-center text-sm text-rose-600 font-semibold mt-4";

        feedback.innerText =
          "Gagal mengirim pesan. Silakan coba kembali.";

      } finally {

        btn.disabled = false;
        btn.innerText = "Kirim Pesan";

        feedback.classList.remove("hidden");
      }
    }
  </script>
</body>
</html>
