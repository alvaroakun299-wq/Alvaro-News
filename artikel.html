<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artikel - Portal Kreatif</title>

  <!-- SEO & Social Media Preview Metadata (Open Graph & Twitter) -->
  <meta name="description" content="Baca berita dan artikel terkini seputar Alvaro dan Vr Lovers.">
  <meta name="keywords" content="alvaro, berita alvaro, vr lovers, artikel">
  <link rel="canonical" href="" id="canonicalLink">

  <!-- Open Graph / Facebook / WhatsApp / Telegram -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="Artikel - Alvaro News" id="ogTitle">
  <meta property="og:description" content="Baca berita dan artikel terkini seputar Alvaro dan Vr Lovers." id="ogDesc">
  <meta property="og:image" content="https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=500" id="ogImage">
  <meta property="og:url" content="" id="ogUrl">
  <meta property="og:site_name" content="Alvaro News">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Artikel - Alvaro News" id="twTitle">
  <meta name="twitter:description" content="Baca berita dan artikel terkini seputar Alvaro dan Vr Lovers." id="twDesc">
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=500" id="twImage">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fcfcfc;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;  
      overflow: hidden;
    }
    /* Dynamic Article Prose & Table Styling */
    .article-rendered-body h2 { font-size: 1.6rem; font-weight: 800; color: #0f172a; margin: 1.5rem 0 0.75rem; }
    .article-rendered-body h3 { font-size: 1.3rem; font-weight: 700; color: #0f172a; margin: 1.25rem 0 0.5rem; }
    .article-rendered-body h4 { font-size: 1.15rem; font-weight: 700; color: #0f172a; margin: 1rem 0 0.5rem; }
    .article-rendered-body p { margin-bottom: 1.25rem; line-height: 1.8; }
    .article-rendered-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1.25rem; }
    .article-rendered-body ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 1.25rem; }
    .article-rendered-body li { margin-bottom: 0.35rem; }
    .article-rendered-body blockquote { border-left: 4px solid #0f172a; padding-left: 1.25rem; font-style: italic; color: #475569; margin: 1.5rem 0; background: #f8fafc; padding-top: 0.5rem; padding-bottom: 0.5rem; border-radius: 0 0.75rem 0.75rem 0; }
    .article-rendered-body a { color: #0284c7; text-decoration: underline; font-weight: 500; }
    .article-rendered-body a:hover { color: #0369a1; }
    .article-rendered-body table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.9rem; }
    .article-rendered-body th, .article-rendered-body td { border: 1px solid #e2e8f0; padding: 10px 14px; text-align: left; }
    .article-rendered-body th { background-color: #f8fafc; font-weight: 700; color: #0f172a; }
    .article-rendered-body hr { border: 0; border-top: 1px solid #e2e8f0; margin: 2rem 0; }
  </style>
</head>
<body class="bg-[#fafafa] text-slate-900 flex flex-col min-h-screen antialiased">

  <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl font-black tracking-tight text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-feather-pointed text-slate-800"></i> ALVARO <span class="font-light text-gray-500">NEWS</span>
        </span>
      </div>
      <nav class="hidden md:flex space-x-8 text-sm font-semibold uppercase tracking-wider text-gray-500">
        <a href="index.html" class="hover:text-slate-950 transition">Beranda</a>
        <a href="artikel.html" class="text-slate-900 border-b-2 border-slate-900 pb-1">Artikel</a>
        <a href="kategori.html" class="hover:text-slate-950 transition">Kategori</a>
        <a href="tentang.html" class="hover:text-slate-950 transition">Tentang</a>
        <a href="kontak.html" class="hover:text-slate-950 transition">Kontak</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16 flex-grow" id="mainContainer">
    <!-- Loading Container -->
    <div class="text-center py-20" id="loader">
      <i class="fa-solid fa-spinner fa-spin text-4xl text-slate-900"></i>
      <p class="text-gray-400 mt-3 text-sm font-light">Memuat halaman...</p>
    </div>
  </main>

  <footer class="bg-slate-950 text-gray-400 py-12 border-t border-gray-900 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center text-sm font-light">
      © 2026 Alvaro News. Hak Cipta Dilindungi.
    </div>
  </footer>

  <script src="config.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const urlParams = new URLSearchParams(window.location.search);
      const articleId = urlParams.get('slug') || urlParams.get('id');
      const searchQuery = urlParams.get('search');

      if (articleId) {
        loadDetail(articleId);
      } else {
        loadList(searchQuery);
      }
      setupMobileMenu();
    });

    function setupMobileMenu() {
      const headerContainer = document.querySelector('header > div');
      if (headerContainer) {
        const mobileMenuBtn = document.createElement('button');
        mobileMenuBtn.className = 'md:hidden text-slate-900 hover:text-black focus:outline-none p-2 ml-2 order-last';
        mobileMenuBtn.innerHTML = '<i class="fa-solid fa-bars text-xl"></i>';
        headerContainer.appendChild(mobileMenuBtn);

        const offCanvas = document.createElement('div');
        offCanvas.className = 'fixed inset-0 bg-black bg-opacity-40 z-50 transform translate-x-full transition-transform duration-300 ease-in-out md:hidden';
        offCanvas.id = 'mobile-offcanvas';
        offCanvas.innerHTML = `
          <div class="bg-white w-64 h-full p-6 flex flex-col justify-between shadow-2xl ml-auto">
            <div>
              <div class="flex items-center justify-between pb-6 border-b border-gray-100">
                <span class="text-lg font-black tracking-tight text-slate-900"><i class="fa-solid fa-feather-pointed"></i> Alvaro News</span>
                <button id="close-offcanvas" class="text-gray-500 hover:text-black"><i class="fa-solid fa-xmark text-xl"></i></button>
              </div>
              <nav class="flex flex-col gap-4 mt-8 text-sm font-semibold uppercase tracking-wider text-gray-500">
                <a href="index.html" class="hover:text-slate-950">Beranda</a>
                <a href="artikel.html" class="text-slate-900">Artikel</a>
                <a href="kategori.html" class="hover:text-slate-950">Kategori</a>
                <a href="tentang.html" class="hover:text-slate-950">Tentang</a>
                <a href="kontak.html" class="hover:text-slate-950">Kontak</a>
              </nav>
            </div>
            <div class="text-[11px] text-gray-400 border-t border-gray-100 pt-4">
              © 2026 Alvaro News.
            </div>
          </div>
        `;
        document.body.appendChild(offCanvas);

        mobileMenuBtn.addEventListener('click', () => {
          offCanvas.classList.remove('translate-x-full');
        });

        offCanvas.querySelector('#close-offcanvas').addEventListener('click', () => {
          offCanvas.classList.add('translate-x-full');
        });

        offCanvas.addEventListener('click', (e) => {
          if (e.target === offCanvas) {
            offCanvas.classList.add('translate-x-full');
          }
        });
      }
    }

    // Pembersih dan Pemformat Konten HTML Aman
    function sanitizeAndFormatContent(rawContent) {
      if (!rawContent) return "";
      
      if (!/<\/?[a-z][\s\S]*>/i.test(rawContent)) {
        return rawContent.split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
      }

      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = rawContent;

      const scripts = tempDiv.querySelectorAll('script, iframe, object, embed');
      scripts.forEach(s => s.remove());

      const links = tempDiv.querySelectorAll('a');
      links.forEach(a => {
        const href = a.getAttribute('href') || '';
        if (href.trim().toLowerCase().startsWith('javascript:')) {
          a.removeAttribute('href');
        } else {
          a.setAttribute('target', '_blank');
          a.setAttribute('rel', 'noopener noreferrer');
        }
      });

      const tables = tempDiv.querySelectorAll('table');
      tables.forEach(table => {
        if (!table.parentElement.classList.contains('overflow-x-auto')) {
          const wrapper = document.createElement('div');
          wrapper.className = 'overflow-x-auto my-4';
          table.parentNode.insertBefore(wrapper, table);
          wrapper.appendChild(table);
        }
      });

      return tempDiv.innerHTML;
    }

    // Pembaruan SEO Metadata & Social Media Preview (OG & Twitter)
    function updateSEOMetadata(art) {
      const pageTitle = `${art.Title} - Alvaro News`;
      document.title = pageTitle;

      const desc = art.Summary || art.Title;
      const currentUrl = window.location.href;
      const thumb = art.Thumbnail || 'https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=500';

      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute("content", desc);

      const canonical = document.getElementById("canonicalLink");
      if (canonical) canonical.setAttribute("href", currentUrl);

      const ogTitle = document.getElementById("ogTitle");
      if (ogTitle) ogTitle.setAttribute("content", pageTitle);

      const ogDesc = document.getElementById("ogDesc");
      if (ogDesc) ogDesc.setAttribute("content", desc);

      const ogImage = document.getElementById("ogImage");
      if (ogImage) ogImage.setAttribute("content", thumb);

      const ogUrl = document.getElementById("ogUrl");
      if (ogUrl) ogUrl.setAttribute("content", currentUrl);

      const twTitle = document.getElementById("twTitle");
      if (twTitle) twTitle.setAttribute("content", pageTitle);

      const twDesc = document.getElementById("twDesc");
      if (twDesc) twDesc.setAttribute("content", desc);

      const twImage = document.getElementById("twImage");
      if (twImage) twImage.setAttribute("content", thumb);
    }

    async function loadDetail(id) {
      const main = document.getElementById("mainContainer");
      try {
        fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'incrementView', id: id })
        });

        const res = await fetch(`${API_URL}?action=getArticles`);
        const result = await res.json();
        
        if (result.success) {
          const art = result.data.find(item => item.Slug === id || item.ID === id);
          if (art) {
            updateSEOMetadata(art);

            const safeHtml = sanitizeAndFormatContent(art.Content);

            const otherArticles = result.data
              .filter(item => item.ID !== art.ID && item.Slug !== art.Slug)
              .slice(0, 3);

            let otherArticlesHtml = '';
            if (otherArticles.length > 0) {
              otherArticlesHtml = `
                <section class="mt-16 pt-12 border-t border-gray-100">
                  <h2 class="text-xl font-black uppercase tracking-wider text-slate-900 mb-8 pb-3 border-b border-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-newspaper text-slate-800"></i> Baca Berita Lainnya
                  </h2>
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                    ${otherArticles.map(item => `
                      <article class="bg-white rounded-2xl border border-gray-100 overflow-hidden flex flex-col hover:shadow-md transition duration-300 group">
                        <div class="overflow-hidden">
                          <img src="${item.Thumbnail || 'https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=500'}" alt="${item.Title}" class="h-36 w-full object-cover group-hover:scale-105 transition duration-500">
                        </div>
                        <div class="p-5 flex flex-col justify-between flex-grow">
                          <div>
                            <span class="text-[10px] font-extrabold text-slate-500 tracking-wider uppercase">${item.Category}</span>
                            <h3 class="text-sm font-bold text-slate-900 mt-1 mb-2 line-clamp-2 hover:text-slate-700 transition">
                              <a href="artikel.html?slug=${item.Slug}">${item.Title}</a>
                            </h3>
                          </div>
                          <div class="text-[10px] text-gray-400 border-t border-gray-50 pt-3 mt-2 flex justify-between">
                            <span>${item.Author}</span>
                            <span>${item.Date}</span>
                          </div>
                        </div>
                      </article>
                    `).join('')}
                  </div>
                </section>
              `;
            }

            main.innerHTML = `
              <article class="bg-white rounded-3xl border border-gray-100 p-8 sm:p-12">
                <nav class="text-xs uppercase tracking-wider text-gray-400 mb-6 flex gap-2">
                  <a href="index.html" class="hover:text-slate-900 transition">Beranda</a> <span>/</span> 
                  <a href="artikel.html" class="hover:text-slate-900 transition">Artikel</a> <span>/</span> 
                  <span class="text-slate-800 font-bold">${art.Category}</span>
                </nav>
                <h1 class="text-3xl sm:text-5xl font-black text-slate-900 mb-6 leading-tight tracking-tight">${art.Title}</h1>
                <div class="flex flex-wrap items-center gap-4 text-xs text-gray-400 mb-4 pb-4 border-b border-gray-100">
                  <span>Oleh: <strong class="text-slate-900">${art.Author}</strong></span>
                  <span>•</span>
                  <span>${art.Date}</span>
                </div>
                <!-- Tombol Salin Tautan Tepat di Bawah Bagian Tanggal -->
                <div class="mb-8">
                  <button type="button" onclick="salinTautanShare('${art.Slug || id}')" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 hover:text-slate-950 text-xs font-semibold uppercase tracking-wider rounded-full transition shadow-sm border border-slate-200/60">
                    <i class="fa-solid fa-link text-xs"></i> Salin Tautan
                  </button>
                </div>
                <img src="${art.Thumbnail}" alt="${art.Title}" class="w-full h-auto rounded-2xl mb-10 object-cover max-h-[500px]">
                <div class="article-rendered-body prose max-w-none text-slate-700 text-[15px] sm:text-[17px] font-light">
                  ${safeHtml}
                </div>
              </article>
              ${otherArticlesHtml}
            `;
          } else {
            main.innerHTML = `<div class="text-center py-20"><h2 class="text-xl font-bold text-slate-900">Artikel tidak ditemukan atau di-draft.</h2><a href="index.html" class="text-xs font-semibold uppercase tracking-wider text-slate-800 border-b border-slate-800 mt-6 inline-block">Kembali ke Beranda</a></div>`;
          }
        }
      } catch (err) {
        main.innerHTML = `<p class="text-red-500 text-center text-sm">Gagal memuat artikel: ${err.message}</p>`;
      }
    }

    async function loadList(searchQuery) {
      const main = document.getElementById("mainContainer");
      try {
        const res = await fetch(`${API_URL}?action=getArticles`);
        const result = await res.json();

        if (result.success) {
          let articles = result.data;
          let titlePrefix = "Semua Artikel";

          if (searchQuery) {
            articles = articles.filter(art => 
              art.Title.toLowerCase().includes(searchQuery.toLowerCase()) || 
              art.Content.toLowerCase().includes(searchQuery.toLowerCase())
            );
            titlePrefix = `Hasil Pencarian: "${searchQuery}"`;
          }

          document.title = `${titlePrefix} - Alvaro News`;

          let htmlContent = `
            <h1 class="text-2xl font-black uppercase tracking-wider text-slate-900 mb-8 border-b-2 border-slate-900 pb-3">${titlePrefix}</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          `;

          if (articles.length === 0) {
            htmlContent += `<p class="col-span-2 text-center text-gray-400 font-light py-12">Tidak ada artikel yang cocok.</p>`;
          } else {
            htmlContent += articles.map(art => `
              <article class="bg-white rounded-2xl border border-gray-100 overflow-hidden flex flex-col hover:shadow-md transition duration-300 group">
                <div class="overflow-hidden">
                  <img src="${art.Thumbnail || 'https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=500'}" class="h-48 w-full object-cover group-hover:scale-105 transition duration-500">
                </div>
                <div class="p-6 flex-grow flex flex-col justify-between">
                  <div>
                    <span class="text-[10px] font-extrabold text-slate-500 tracking-wider uppercase">${art.Category}</span>
                    <h3 class="text-base font-bold text-slate-900 mt-2 mb-2 line-clamp-2 hover:text-slate-700 transition">
                      <a href="artikel.html?slug=${art.Slug}">${art.Title}</a>
                    </h3>
                    <p class="text-xs text-gray-400 line-clamp-2 mb-4 font-light">${art.Summary}</p>
                  </div>
                  <div class="flex items-center justify-between text-[11px] text-gray-400 border-t border-gray-50 pt-4 mt-2">
                    <span class="font-medium text-slate-700">${art.Author}</span>
                    <span>${art.Date}</span>
                  </div>
                </div>
              </article>
            `).join('');
          }

          htmlContent += `</div>`;
          main.innerHTML = htmlContent;
        }
      } catch (err) {
        main.innerHTML = `<p class="text-red-500 text-center text-sm">Gagal memuat daftar artikel: ${err.message}</p>`;
      }
    }

    // Fungsi untuk membuat format URL share.php, menyalin ke clipboard, dan menampilkan alert
    function salinTautanShare(customSlug) {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = customSlug || urlParams.get('slug') || urlParams.get('id') || '';
      
      const currentOrigin = window.location.origin;
      const currentPath = window.location.pathname;
      const basePath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
      const shareUrl = `${currentOrigin}${basePath}share.php?slug=${encodeURIComponent(slug)}`;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          alert("Tautan berhasil disalin:\n" + shareUrl);
        }).catch(() => {
          fallbackSalinTeks(shareUrl);
        });
      } else {
        fallbackSalinTeks(shareUrl);
      }
    }

    function fallbackSalinTeks(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      textArea.style.top = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        alert("Tautan berhasil disalin:\n" + text);
      } catch (err) {
        alert("Gagal menyalin tautan: " + err);
      }
      textArea.remove();
    }
  </script>
</body>
</html>
