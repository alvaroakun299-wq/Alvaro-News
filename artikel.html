<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artikel - Portal Kreatif</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl font-bold text-indigo-600"><i class="fa-solid fa-feather-pointed"></i> Alvaro News</span>
      </div>
      <nav class="hidden md:flex space-x-8 text-sm font-medium text-gray-600">
        <a href="index.html" class="hover:text-indigo-600 transition">Beranda</a>
        <a href="artikel.html" class="text-indigo-600">Artikel</a>
        <a href="kategori.html" class="hover:text-indigo-600 transition">Kategori</a>
        <a href="tentang.html" class="hover:text-indigo-600 transition">Tentang</a>
        <a href="kontak.html" class="hover:text-indigo-600 transition">Kontak</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow" id="mainContainer">
    <!-- Loading Container -->
    <div class="text-center py-20" id="loader">
      <i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-600"></i>
      <p class="text-gray-500 mt-2">Memuat halaman...</p>
    </div>
  </main>

  <footer class="bg-gray-900 text-gray-400 py-8 border-t border-gray-800 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center text-sm">
      © 2026 Artikelku. Hak Cipta Dilindungi.
    </div>
  </footer>

  <script src="config.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const urlParams = new URLSearchParams(window.location.search);
      const articleId = urlParams.get('id');
      const searchQuery = urlParams.get('search');

      if (articleId) {
        loadDetail(articleId);
      } else {
        loadList(searchQuery);
      }
    });

    async function loadDetail(id) {
      const main = document.getElementById("mainContainer");
      try {
        // Increment View terlebih dahulu secara asynchronous di background
        fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'incrementView', id: id })
        });

        const res = await fetch(`${API_URL}?action=getArticles`);
        const result = await res.json();
        
        if (result.success) {
          const art = result.data.find(item => item.ID === id);
          if (art) {
            document.title = `${art.Title} - Artikelku`;
            main.innerHTML = `
              <article class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 md:p-8">
                <nav class="text-sm text-gray-500 mb-4">
                  <a href="index.html" class="hover:underline">Beranda</a> &gt; 
                  <a href="artikel.html" class="hover:underline">Artikel</a> &gt; 
                  <span class="text-gray-700">${art.Category}</span>
                </nav>
                <h1 class="text-3xl md:text-4xl font-extrabold text-gray-950 mb-4 leading-tight">${art.Title}</h1>
                <div class="flex items-center gap-4 text-sm text-gray-500 mb-8 pb-4 border-b">
                  <span>Oleh: <strong class="text-gray-800">${art.Author}</strong></span>
                  <span>•</span>
                  <span>${art.Date}</span>
                  <span>•</span>
                  <span><i class="fa-regular fa-eye"></i> ${Number(art.Views) + 1} Pembaca</span>
                </div>
                <img src="${art.Thumbnail}" alt="${art.Title}" class="w-full h-auto rounded-lg mb-8 object-cover max-h-[450px]">
                <div class="prose max-w-none text-gray-700 leading-relaxed text-lg whitespace-pre-line">
                  ${art.Content}
                </div>
              </article>
            `;
          } else {
            main.innerHTML = `<div class="text-center py-20"><h2 class="text-xl font-semibold text-gray-800">Artikel tidak ditemukan atau di-draft.</h2><a href="index.html" class="text-indigo-600 hover:underline mt-4 inline-block">Kembali ke Beranda</a></div>`;
          }
        }
      } catch (err) {
        main.innerHTML = `<p class="text-red-500 text-center">Gagal memuat artikel: ${err.message}</p>`;
      }
    }

    async function loadList(searchQuery) {
      const main = document.getElementById("mainContainer");
      try {
        const res = await fetch(`${API_URL}?action=getArticles`);
        const result = await res.json();

        if (result.success) {
          let articles = result.data;
          let titlePrefix = "Semua Artikel";

          if (searchQuery) {
            articles = articles.filter(art => 
              art.Title.toLowerCase().includes(searchQuery.toLowerCase()) || 
              art.Content.toLowerCase().includes(searchQuery.toLowerCase())
            );
            titlePrefix = `Hasil Pencarian: "${searchQuery}"`;
          }

          document.title = `${titlePrefix} - Artikelku`;

          let htmlContent = `
            <h1 class="text-3xl font-extrabold text-gray-900 mb-8 border-b-2 border-indigo-500 pb-2">${titlePrefix}</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          `;

          if (articles.length === 0) {
            htmlContent += `<p class="col-span-2 text-center text-gray-500 py-12">Tidak ada artikel yang cocok.</p>`;
          } else {
            htmlContent += articles.map(art => `
              <article class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden flex flex-col hover:shadow-md transition">
                <img src="${art.Thumbnail || 'https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=500'}" class="h-44 w-full object-cover">
                <div class="p-5 flex-grow flex flex-col justify-between">
                  <div>
                    <span class="text-xs font-semibold text-indigo-600 uppercase">${art.Category}</span>
                    <h3 class="text-lg font-bold text-gray-900 mt-1 mb-2 line-clamp-2">
                      <a href="artikel.html?id=${art.ID}" class="hover:text-indigo-600">${art.Title}</a>
                    </h3>
                    <p class="text-sm text-gray-600 line-clamp-2 mb-4">${art.Summary}</p>
                  </div>
                  <div class="flex items-center justify-between text-xs text-gray-500 border-t pt-3">
                    <span>${art.Author}</span>
                    <span>${art.Date}</span>
                  </div>
                </div>
              </article>
            `).join('');
          }

          htmlContent += `</div>`;
          main.innerHTML = htmlContent;
        }
      } catch (err) {
        main.innerHTML = `<p class="text-red-500 text-center">Gagal memuat daftar artikel: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
